<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista 360° — Projeto em Canasvieiras</title>
  <link rel="stylesheet" href="./pannellum.css">
  <link rel="stylesheet" href="./controls.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #0c302c; }
    #panorama { grid-column: 2; grid-row: 1; width: 100%; height: 100%; min-width: 0; min-height: 0; border-radius: 4px; }
    #panorama:fullscreen { width: 100vw; height: 100vh; }
    .pnlm-container { font-family: Arial, sans-serif; }
    .pnlm-controls { border-radius: 6px; }
    #panorama:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
    noscript { position: absolute; inset: 40% 1rem auto; color: white; text-align: center; }
  </style>
</head>
<body>
  <div id="panorama" role="region" aria-label="Panorama 360 graus. Arraste ou use as setas do teclado para explorar."></div>
  <aside class="view-panel" aria-label="Escolher vista do empreendimento">
    <div class="panel-heading"><span>PROJETO EM CANASVIEIRAS</span><h2>Escolha sua vista</h2></div>
    <fieldset><legend>Selecione a vista</legend><div id="view-controls" class="view-controls"></div></fieldset>
    <details class="debug-panel" hidden>
      <summary>Depuração de marcações</summary>
      <p class="debug-help">Escolha um ponto, ajuste X/Y e salve a posição na vista atual.</p>
      <label class="debug-label" for="debug-place">Ponto</label>
      <select id="debug-place" class="debug-select"></select>
      <div class="debug-axis">
        <label for="debug-x">X <output id="debug-x-value">0°</output></label>
        <input id="debug-x" type="range" min="-180" max="180" step="1" value="0">
      </div>
      <div class="debug-axis">
        <label for="debug-y">Y <output id="debug-y-value">0°</output></label>
        <input id="debug-y" type="range" min="-90" max="90" step="1" value="0">
      </div>
      <div class="debug-actions">
        <button id="debug-save" class="debug-copy" type="button">Salvar posição</button>
        <button id="debug-copy" class="debug-copy" type="button">Copiar posição</button>
      </div>
      <output id="debug-output" class="debug-output" aria-live="polite"></output>
    </details>
    <button id="north-control" class="north-control" type="button" disabled><span aria-hidden="true">↑ N</span> Ver o norte</button>
    <p id="view-status" class="view-status" role="status"></p>
    <p class="panel-note">Opções indisponíveis aguardam imagens. Norte pendente de orientação.</p>
  </aside>
  <noscript>Ative o JavaScript para explorar a vista em 360°.</noscript>
  <script src="./pannellum.js"></script>
  <script src="./views.js"></script>
  <script src="./viewer.js"></script>
</body>
</html>

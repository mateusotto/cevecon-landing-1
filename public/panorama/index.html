<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista 360° — Cannan Residence</title>
  <link rel="stylesheet" href="./pannellum.css">
  <link rel="stylesheet" href="./controls.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #0c302c; }
    #panorama { grid-column: 2; grid-row: 1; width: 100%; height: 100%; min-width: 0; min-height: 0; border-radius: 4px; }
    #panorama:fullscreen { width: 100vw; height: 100vh; }
    .pnlm-container { font-family: Arial, sans-serif; }
    .pnlm-controls { border-radius: 6px; }
    #panorama:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
    noscript { position: absolute; inset: 40% 1rem auto; color: white; text-align: center; }
  </style>
</head>
<body>
  <div id="panorama" role="region" aria-label="Panorama 360 graus. Arraste ou use as setas do teclado para explorar."></div>
  <aside class="view-panel" aria-label="Escolher vista do empreendimento">
    <div class="panel-heading"><span>CANNAN RESIDENCE</span><h2>Escolha sua vista</h2></div>
    <fieldset><legend>Andar</legend><div class="building-roof" aria-hidden="true"></div><div id="floor-controls" class="building"></div><div class="building-base" aria-hidden="true"></div></fieldset>
    <fieldset><legend>Momento do dia</legend><div id="time-controls" class="time-controls"></div></fieldset>
    <button id="north-control" class="north-control" type="button" disabled><span aria-hidden="true">↑ N</span> Ver o norte</button>
    <p id="view-status" class="view-status" role="status"></p>
    <p class="panel-note">Opções indisponíveis aguardam imagens. Norte pendente de orientação.</p>
  </aside>
  <noscript>Ative o JavaScript para explorar a vista em 360°.</noscript>
  <script src="./pannellum.js"></script>
  <script src="./views.js"></script>
  <script src="./viewer.js"></script>
</body>
</html>
